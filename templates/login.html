{% extends 'base.html' %}

{% block title %}
Login · Resume2Interview AI
{% endblock %}

{% block content %}

<div class="auth">

  <div class="authbox">
<div class="eyebrow">
  WELCOME BACK
</div>

<h1>
  Sign in
</h1>

<p>
  Continue your interview preparation.
</p>

<form method="post">

  <label>
    Email

    <input
      type="email"
      name="email"
      required
    >

  </label>


  <label>
    Password

    <input
      type="password"
      name="password"
      required
    >

  </label>


  <button
    type="submit"
    class="btn primary full"
  >
    Login
  </button>

</form>


<div class="switch">

  New here?

  <a href="{{ url_for('register') }}">
    Create an account
  </a>

</div>

  </div>

</div>

{% endblock %}
